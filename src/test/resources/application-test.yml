# Las pruebas NO usan Redis para las sesiones: montar un Redis por contexto de
# prueba las haría lentas y frágiles, y lo que se prueba aquí no es dónde se
# guarda la sesión. En los entornos reales manda el valor por defecto: redis.
spring:
  # En las pruebas NO se levanta ningún cliente de Redis.
  #
  # No es solo por rapidez: con la autoconfiguración activa, Lettuce intenta
  # conectar en cada petición, reintenta, y llena el registro de la cadena de
  # entrega con miles de líneas de excepciones que tapan los fallos de verdad.
  # Sin el bean, el código que lo usa cae solo a su registro en memoria, que es
  # justo el camino que conviene ejercitar aquí.
  # NO se excluye la autoconfiguración de Redis. Se intentó, y el contexto dejó de arrancar: el
  # asistente (chatUseCaseImpl) exige un StringRedisTemplate y no sabe vivir sin él.
  #
  # Durante un tiempo pareció que sí se excluía —había un bloque con RedisAutoConfiguration y
  # RedisRepositoriesAutoConfiguration—, pero esos nombres son de Spring Boot 3: aquí no existen, y
  # una exclusión que no encuentra su clase no excluye nada. La configuración que llevaba meses
  # funcionando era, en realidad, la de no excluir. Queda escrito para que nadie "arregle" los
  # nombres y tumbe los tests de integración enteros.
  #
  # No hace falta excluirlo: el cliente de Redis no conecta al arrancar, sino al primer uso, y la
  # sesión ya está en memoria por `session.store-type: none`.
  session:
    store-type: none
  # El perfil 'test' lo activa @ActiveProfiles; un recurso -test.yml no puede fijar spring.profiles.active.
  # El datasource lo inyecta Testcontainers vía @ServiceConnection (PostgreSQLContainer) en
  # los tests de integración (*IT). Los unit (*Test, Mockito) no cargan contexto de Spring.
  jpa:
    hibernate:
      # El esquema lo crea Liquibase; validate confirma que las entidades casan con las migraciones.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false
  trend:
    # En tests el recálculo se dispara a mano desde su propio test, no por cron.
    recompute-enabled: false
    recompute-cron: "-"
    reindex-after-recompute: false
  legal:
    # Apagado en tests: el aviso recorre TODAS las cuentas activas y encolaría correos en cada caso que
    # levante el contexto. Quien lo prueba es Cov05LegalUpdateNoticeServiceTest, encendiéndolo a mano.
    notify-on-change: false
  liquibase:
    enabled: true
    # Igual que dev/pre/pro: solo migraciones de esquema, sin los seeds demo (context:demo),
    # que insertan datos con FKs a usuarios que no existen en una BD de test limpia.
    contexts: "!demo"
  data:
    redis:
      repositories:
        enabled: false
  kafka:
    bootstrap-servers: 127.0.0.1:1
    listener:
      auto-startup: false
  mail:
    host: localhost
    port: 1025

server:
  port: 0

nexadrop:
  search:
    # Sin reindexado automático al arrancar: en los tests el índice se puebla explícitamente cuando hace
    # falta, y un barrido de fondo sobre el catálogo entero solo añadiría ruido y lentitud.
    auto-reindex: false
  captcha:
    # Los tests no resuelven proof-of-work: se desactiva la verificación para no bloquear los POST
    # a los formularios públicos (registro, contacto, reset, newsletter).
    enabled: false
  oauth:
    issuer: http://localhost:18082
    admin-spa:
      client-id: nexadrop-admin
      redirect-uri: http://localhost:3003/auth/callback
      post-logout-redirect-uri: http://localhost:3003/
    storefront-spa:
      client-id: nexadrop-storefront
      redirect-uri: http://localhost:3003/auth/callback
      post-logout-redirect-uri: http://localhost:3003/
    partner-api:
      default-secret: test-partner-secret-very-long-12chars
  cors:
    allowed-origins: http://localhost:3003
  storage:
    endpoint: http://localhost:9000
    region: us-east-1
    access-key: test
    secret-key: test
    bucket: test
    public-base-url: http://localhost:9000/test
    path-style-access: true
  opensearch:
    # Puerto MUERTO a propósito. Apuntaba a localhost:9200 y, en cualquier máquina con un OpenSearch
    # levantado —la de desarrollo lo tiene—, los tests de integración leían el índice REAL: aparecían
    # pedidos y productos de otro conjunto de datos en respuestas que el test creía haber sembrado él.
    # Un test que depende de qué haya arrancado en la máquina no certifica nada.
    # Sin OpenSearch alcanzable, la búsqueda cae al fallback SQL, que es determinista y es justo lo que
    # queremos ejercitar aquí; la ruta de OpenSearch se prueba aparte, con su propio contenedor.
    uris: http://127.0.0.1:1
    products-index: products-test
  crawler:
    base-url: http://localhost:8001
    timeout-seconds: 30
  translation:
    enabled: false
    project-id:
    default-source: zh
    target-languages: es,en
  stripe:
    enabled: false

logging:
  level:
    root: WARN
    com.nexaplatform.dropshipping: INFO
