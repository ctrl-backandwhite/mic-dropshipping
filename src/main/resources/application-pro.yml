# =====================================================================================
# Perfil PRO (VPS propio (k3s + Argo CD), producción)
#   Frontend: ${NX_WEB_URL:https://nx036.com}
#   Backend : ${NX_API_URL:https://api.nx036.com}  (servidor de autorización)
#
# Local sigue usando application-local.yml (localhost). Aquí solo se sobrescriben las URLs
# públicas: issuer del authorization server (backend) y los dominios de confianza (frontend)
# para redirects OAuth, callback de Google, CORS y enlaces de email.
#
# Los SECRETOS (Google client id/secret, BD, KEKs, etc.) NUNCA van aquí: se inyectan por
# variables de entorno en Railway (ya soportadas en application.yml).
# =====================================================================================
spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  liquibase:
    # Datos reales: NO ejecutar los seeds demo (context:demo).
    contexts: "!demo"
  kafka:
    # Kafka KRaft seguro (SASL/SCRAM). El JAAS (usuario+password) llega por env.
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:SCRAM-SHA-256}
      sasl.jaas.config: ${KAFKA_SASL_JAAS:}
  security:
    oauth2:
      client:
        registration:
          google:
            # Auth por token (sin proxy nginx): Google redirige al BACKEND; su success handler
            # emite el token y redirige al front (<front>/auth/callback#token=…).
            # El retorno va al MISMO dominio por el que se entró, no al de la API.
              #
              # La sesión que guarda la petición de autorización se crea al
              # arrancar el flujo en el dominio del frontal, y su cookie es de
              # ESE dominio: el navegador no la manda a otro. Volviendo a la API
              # no había sesión y el acceso moría con
              # "authorization_request_not_found", incluso con una sola réplica.
              #
              # nginx ya hace proxy de /login/oauth2/ hacia el backend.
              redirect-uri: "${NX_WEB_URL:https://nx036.com}/login/oauth2/code/google"

server:
  servlet:
    session:
      cookie:
        secure: true
        same-site: lax

nexadrop:
  # ── Bus de integración ──────────────────────────────────────────────────────
  # Kafka SEPARADO del interno de la tienda. Por aquí viaja el catálogo certificado
  # hacia los demás entornos y, más adelante, hacia los clientes con plan de pago.
  bus:
    enabled: ${BUS_ENABLED:false}
    bootstrap-servers: ${BUS_BOOTSTRAP_SERVERS:}
    # Publicar y consumir son interruptores DISTINTOS a propósito: si el entorno que
    # consume publicara además lo que recibe, cada producto volvería al bus al
    # guardarse y se realimentaría sin fin.
    publicar: ${BUS_PUBLICAR:false}
    consumir: ${BUS_CONSUMIR:true}
    group-id: ${BUS_GROUP_ID:nexadrop-catalogo-pro}
  storefront:
    base-url: ${NX_WEB_URL:https://nx036.com}
  mobile:
    # Enlace profundo de la app; debe coincidir con el `scheme` de app.config.ts.
    oauth-callback-url: ${MOBILE_OAUTH_CALLBACK_URL:nx036://auth/callback}
  oauth:
    issuer: ${NX_API_URL:https://api.nx036.com}
  cors:
    allowed-origins: ${NX_WEB_URL:https://nx036.com},${NX_API_URL:https://api.nx036.com}
  cainiao:
    # En PRODUCCIÓN: integración real activa por defecto, contra el gateway de PRODUCCIÓN de Cainiao.
    # appKey/appSecret de la cuenta de PROD se inyectan por env (CAINIAO_APP_KEY / CAINIAO_APP_SECRET).
    enabled: ${CAINIAO_ENABLED:true}
    base-url: ${CAINIAO_BASE_URL:https://link.cainiao.com/gateway/link.do}

