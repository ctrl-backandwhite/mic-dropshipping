databaseChangeLog:
  - changeSet:
      id: 010-password-reset-token
      author: nexadrop
      changes:
        - createTable:
            tableName: password_reset_token
            columns:
              - column: { name: id, type: UUID, constraints: { primaryKey: true, nullable: false } }
              - column: { name: user_id, type: UUID, constraints: { nullable: false } }
              - column: { name: token_hash, type: VARCHAR(128), constraints: { nullable: false, unique: true } }
              - column: { name: expires_at, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
              - column: { name: consumed_at, type: TIMESTAMP WITH TIME ZONE }
              - column: { name: created_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: now(), constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableName: password_reset_token
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_prtok_user
            onDelete: CASCADE
        - createIndex:
            tableName: password_reset_token
            indexName: idx_prtok_user
            columns: [{ column: { name: user_id } }]
