databaseChangeLog:
  - changeSet:
      id: 001-extensions
      author: nexadrop
      changes:
        - sql:
            sql: CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
        - sql:
            sql: CREATE EXTENSION IF NOT EXISTS "pg_trgm";

  - changeSet:
      id: 001-users
      author: nexadrop
      changes:
        - createTable:
            tableName: users
            columns:
              - column: { name: id, type: UUID, constraints: { primaryKey: true, nullable: false } }
              - column: { name: email, type: VARCHAR(254), constraints: { nullable: false, unique: true } }
              - column: { name: password_hash, type: VARCHAR(255) }
              - column: { name: role, type: VARCHAR(30), defaultValue: "USER", constraints: { nullable: false } }
              - column: { name: active, type: BOOLEAN, defaultValueBoolean: false, constraints: { nullable: false } }
              - column: { name: activation_code, type: VARCHAR(64) }
              - column: { name: activation_code_expires_at, type: TIMESTAMP WITH TIME ZONE }
              - column: { name: failed_login_count, type: INT, defaultValueNumeric: 0 }
              - column: { name: locked_until, type: TIMESTAMP WITH TIME ZONE }
              - column: { name: last_login, type: TIMESTAMP WITH TIME ZONE }
              - column: { name: display_name, type: VARCHAR(120) }
              - column: { name: company_name, type: VARCHAR(180) }
              - column: { name: country, type: VARCHAR(60) }
              - column: { name: phone, type: VARCHAR(40) }
              - column: { name: avatar_url, type: VARCHAR(500) }
              - column: { name: language, type: VARCHAR(8), defaultValue: "es" }
              - column: { name: created_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: now(), constraints: { nullable: false } }
              - column: { name: updated_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: now(), constraints: { nullable: false } }
        - createIndex:
            tableName: users
            indexName: idx_users_email
            columns: [{ column: { name: email } }]

  - changeSet:
      id: 001-oauth-registered-clients
      author: nexadrop
      changes:
        - createTable:
            tableName: oauth2_registered_client
            columns:
              - column: { name: id, type: VARCHAR(100), constraints: { primaryKey: true, nullable: false } }
              - column: { name: client_id, type: VARCHAR(100), constraints: { nullable: false } }
              - column: { name: client_id_issued_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: now() }
              - column: { name: client_secret, type: VARCHAR(200) }
              - column: { name: client_secret_expires_at, type: TIMESTAMP WITH TIME ZONE }
              - column: { name: client_name, type: VARCHAR(200), constraints: { nullable: false } }
              - column: { name: client_authentication_methods, type: VARCHAR(1000), constraints: { nullable: false } }
              - column: { name: authorization_grant_types, type: VARCHAR(1000), constraints: { nullable: false } }
              - column: { name: redirect_uris, type: VARCHAR(1000) }
              - column: { name: post_logout_redirect_uris, type: VARCHAR(1000) }
              - column: { name: scopes, type: VARCHAR(1000), constraints: { nullable: false } }
              - column: { name: client_settings, type: VARCHAR(2000), constraints: { nullable: false } }
              - column: { name: token_settings, type: VARCHAR(2000), constraints: { nullable: false } }

  - changeSet:
      id: 001-oauth-authorization
      author: nexadrop
      changes:
        - createTable:
            tableName: oauth2_authorization
            columns:
              - column: { name: id, type: VARCHAR(100), constraints: { primaryKey: true, nullable: false } }
              - column: { name: registered_client_id, type: VARCHAR(100), constraints: { nullable: false } }
              - column: { name: principal_name, type: VARCHAR(200), constraints: { nullable: false } }
              - column: { name: authorization_grant_type, type: VARCHAR(100), constraints: { nullable: false } }
              - column: { name: authorized_scopes, type: VARCHAR(1000) }
              - column: { name: attributes, type: TEXT }
              - column: { name: state, type: VARCHAR(500) }
              - column: { name: authorization_code_value, type: TEXT }
              - column: { name: authorization_code_issued_at, type: TIMESTAMP WITH TIME ZONE }
              - column: { name: authorization_code_expires_at, type: TIMESTAMP WITH TIME ZONE }
              - column: { name: authorization_code_metadata, type: TEXT }
              - column: { name: access_token_value, type: TEXT }
              - column: { name: access_token_issued_at, type: TIMESTAMP WITH TIME ZONE }
              - column: { name: access_token_expires_at, type: TIMESTAMP WITH TIME ZONE }
              - column: { name: access_token_metadata, type: TEXT }
              - column: { name: access_token_type, type: VARCHAR(100) }
              - column: { name: access_token_scopes, type: VARCHAR(1000) }
              - column: { name: oidc_id_token_value, type: TEXT }
              - column: { name: oidc_id_token_issued_at, type: TIMESTAMP WITH TIME ZONE }
              - column: { name: oidc_id_token_expires_at, type: TIMESTAMP WITH TIME ZONE }
              - column: { name: oidc_id_token_metadata, type: TEXT }
              - column: { name: refresh_token_value, type: TEXT }
              - column: { name: refresh_token_issued_at, type: TIMESTAMP WITH TIME ZONE }
              - column: { name: refresh_token_expires_at, type: TIMESTAMP WITH TIME ZONE }
              - column: { name: refresh_token_metadata, type: TEXT }
              - column: { name: user_code_value, type: TEXT }
              - column: { name: user_code_issued_at, type: TIMESTAMP WITH TIME ZONE }
              - column: { name: user_code_expires_at, type: TIMESTAMP WITH TIME ZONE }
              - column: { name: user_code_metadata, type: TEXT }
              - column: { name: device_code_value, type: TEXT }
              - column: { name: device_code_issued_at, type: TIMESTAMP WITH TIME ZONE }
              - column: { name: device_code_expires_at, type: TIMESTAMP WITH TIME ZONE }
              - column: { name: device_code_metadata, type: TEXT }

  - changeSet:
      id: 001-oauth-authorization-consent
      author: nexadrop
      changes:
        - createTable:
            tableName: oauth2_authorization_consent
            columns:
              - column: { name: registered_client_id, type: VARCHAR(100), constraints: { nullable: false } }
              - column: { name: principal_name, type: VARCHAR(200), constraints: { nullable: false } }
              - column: { name: authorities, type: VARCHAR(1000), constraints: { nullable: false } }
        - addPrimaryKey:
            tableName: oauth2_authorization_consent
            columnNames: registered_client_id,principal_name
            constraintName: pk_oauth2_authorization_consent

  - changeSet:
      id: 001-jwk-keys
      author: nexadrop
      changes:
        - createTable:
            tableName: jwk_keys
            columns:
              - column: { name: id, type: UUID, constraints: { primaryKey: true, nullable: false } }
              - column: { name: kid, type: VARCHAR(100), constraints: { nullable: false, unique: true } }
              - column: { name: public_key, type: TEXT, constraints: { nullable: false } }
              - column: { name: private_key, type: TEXT, constraints: { nullable: false } }
              - column: { name: active, type: BOOLEAN, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: created_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: now(), constraints: { nullable: false } }
              - column: { name: rotated_at, type: TIMESTAMP WITH TIME ZONE }
