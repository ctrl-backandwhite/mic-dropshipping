# =====================================================================================
# Perfil DES (desarrollo, VPS propio (k3s + Argo CD), entorno de desarrollo)
#   Frontend: https://nx036.com
#   Backend : ${NX_API_URL:https://api-dev.nx036.com}  (servidor de autorización)
#
# Réplica de application-dev.yml pero con las URLs públicas de PRE: issuer del authorization
# server (backend), callback de Google, CORS y enlaces de email apuntan al entorno pre. Solo se
# carga cuando SPRING_PROFILES_ACTIVE=des → no afecta a dev (perfil dev) ni a pro (perfil pro).
#
# Los SECRETOS (Google client id/secret, BD, KEKs, etc.) NUNCA van aquí: se inyectan por
# variables de entorno en Railway (ya soportadas en application.yml).
# =====================================================================================
spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  liquibase:
    # Datos reales: NO ejecutar los seeds demo (context:demo), que asumen usuarios/catálogo previos.
    contexts: "!demo"
  kafka:
    # Kafka KRaft seguro (SASL/SCRAM) en Railway. El JAAS (usuario+password) llega por env.
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:SCRAM-SHA-256}
      sasl.jaas.config: ${KAFKA_SASL_JAAS:}
  security:
    oauth2:
      client:
        registration:
          google:
            # Auth por token (sin proxy nginx): Google redirige al BACKEND directamente (mismo dominio
            # donde el SPA inicia el OAuth, para que la sesión/state del callback cuadre); su success
            # handler emite el token y redirige al front (nx036.com/auth/callback#token=…).
            # El front es estático (Railpack) y NO puede proxiar /login/oauth2/**, por eso el callback
            # NO puede ir a nx036.com. Override-able por GOOGLE_REDIRECT_URI (p. ej. api.nx036.com si se
            # da al backend un subdominio propio).
            # El valor por defecto apuntaba a PRODUCCIÓN: quien iniciara sesión aquí
              # acababa devuelto a la tienda real. Cada entorno vuelve al suyo.
              # El retorno va al MISMO dominio por el que se entró, no al de la API.
              #
              # La sesión que guarda la petición de autorización se crea al
              # arrancar el flujo en el dominio del frontal, y su cookie es de
              # ESE dominio: el navegador no la manda a otro. Volviendo a la API
              # no había sesión y el acceso moría con
              # "authorization_request_not_found", incluso con una sola réplica.
              #
              # nginx ya hace proxy de /login/oauth2/ hacia el backend.
              redirect-uri: "${NX_WEB_URL:https://dev.nx036.com}/login/oauth2/code/google"
          github:
            redirect-uri: "${NX_WEB_URL:https://dev.nx036.com}/login/oauth2/code/github"

server:
  servlet:
    session:
      cookie:
        secure: true        # HTTPS en Railway
        same-site: lax       # el SPA usa el dominio del frontend (mismo origen vía proxy) → lax es correcto

nexadrop:
  # ── Bus de integración ──────────────────────────────────────────────────────
  # Kafka SEPARADO del interno de la tienda. Por aquí viaja el catálogo certificado
  # hacia los demás entornos y, más adelante, hacia los clientes con plan de pago.
  bus:
    enabled: ${BUS_ENABLED:false}
    bootstrap-servers: ${BUS_BOOTSTRAP_SERVERS:}
    # Publicar y consumir son interruptores DISTINTOS a propósito: si el entorno que
    # consume publicara además lo que recibe, cada producto volvería al bus al
    # guardarse y se realimentaría sin fin.
    publicar: ${BUS_PUBLICAR:false}
    consumir: ${BUS_CONSUMIR:false}
    group-id: ${BUS_GROUP_ID:nexadrop-catalogo-des}
  storefront:
    base-url: ${NX_WEB_URL:https://dev.nx036.com}   # CTA y baja de los correos, y regreso tras el acceso con Google
  mobile:
    # Enlace profundo de la app; debe coincidir con el `scheme` de app.config.ts.
    oauth-callback-url: ${MOBILE_OAUTH_CALLBACK_URL:nx036://auth/callback}
  oauth:
    # Identidad del authorization server y emisor de los JWT de usuario (este backend).
    issuer: ${NX_API_URL:https://api-dev.nx036.com}
  cors:
    # Dominios de confianza desde los que se accede a la API (frontend + el propio backend).
    allowed-origins: ${NX_WEB_URL:https://dev.nx036.com},${NX_API_URL:https://api-dev.nx036.com}

