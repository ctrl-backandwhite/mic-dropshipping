<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="referrer" content="no-referrer"/>
  <title>NX036</title>
</head>
<!--
  Aviso de cambio en los términos y en la política de privacidad.

  Sin imágenes de producto ni adornos: es una comunicación de servicio y tiene que leerse como tal. Y sin
  enlace de baja, a propósito — no hay lista de la que salirse, así que ofrecer una baja sería mentir. Lo
  que sí lleva es la salida real: si el usuario no está de acuerdo, puede cerrar su cuenta.
-->
<body style="margin:0;background:#f4f6f9;font-family:Arial,Helvetica,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f4f6f9;">
  <tr><td align="center" style="padding:24px 12px;">
    <table role="presentation" width="600" align="center" cellpadding="0" cellspacing="0" border="0" style="width:600px;max-width:600px;margin:0 auto;background:#ffffff;border-radius:16px;overflow:hidden;border:1px solid #e3e8ef;box-shadow:0 10px 32px rgba(12,74,151,0.22);-fs-box-shadow:0 10px 32px 0 rgba(12,74,151,0.22);">

      <tr><td style="padding:26px 32px 8px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
          <td><div style="width:34px;height:34px;border-radius:9px;background:#0c4a97;color:#ffffff;font-weight:700;font-size:17px;text-align:center;line-height:34px;">N</div></td>
          <td style="padding-left:10px;font-size:16px;font-weight:700;color:#14212e;">NX036</td>
        </tr></table>
      </td></tr>

      <tr><td style="padding:12px 32px 0;">
        <h1 style="margin:0 0 10px;font-size:21px;font-weight:700;color:#14212e;" th:text="${title}">Cambios en nuestras condiciones</h1>
        <div style="font-size:14px;line-height:1.6;color:#5c6e7c;" th:text="${intro}">Hemos publicado una nueva versión.</div>
      </td></tr>

      <tr><td style="padding:16px 32px 0;">
        <div style="font-size:14px;line-height:1.6;color:#5c6e7c;" th:text="${whatToDo}">Puedes cerrar tu cuenta si no estás de acuerdo.</div>
      </td></tr>

      <!-- Los dos documentos, con el mismo peso visual: cambian a la vez y se aceptan juntos. -->
      <tr><td style="padding:22px 32px 6px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"><tr>
          <td style="padding-right:6px;">
            <a th:href="${privacyUrl}" th:text="${privacyLabel}"
               style="display:block;text-align:center;padding:12px 18px;background:#0c4a97;color:#ffffff;font-size:13px;font-weight:700;text-decoration:none;border-radius:10px;font-family:Arial,Helvetica,sans-serif;">Leer la política de privacidad</a>
          </td>
          <td style="padding-left:6px;">
            <a th:href="${termsUrl}" th:text="${termsLabel}"
               style="display:block;text-align:center;padding:12px 18px;background:#ffffff;color:#0c4a97;border:1px solid #0c4a97;font-size:13px;font-weight:700;text-decoration:none;border-radius:10px;font-family:Arial,Helvetica,sans-serif;">Leer los términos de uso</a>
          </td>
        </tr></table>
      </td></tr>

      <!-- La versión, visible: es la referencia que permite al usuario saber QUÉ texto está mirando. -->
      <tr><td style="padding:18px 32px 0;">
        <div style="font-size:12px;color:#9aa4b2;">
          <span>Versión</span> <span th:text="${version}" style="font-weight:700;color:#5c6e7c;">2026-08-15</span>
        </div>
      </td></tr>

      <tr><td style="padding:16px 32px 26px;">
        <hr style="border:0;border-top:1px solid #e3e8ef;margin:0 0 12px;"/>
        <div style="font-size:11px;line-height:1.6;color:#9aa4b2;" th:text="${footerNote}">
          Recibes este aviso porque tienes una cuenta en NX036.
        </div>
      </td></tr>

    </table>
  </td></tr>
</table>
</body>
</html>
