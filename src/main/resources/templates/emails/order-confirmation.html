<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Order confirmed</title>
    <style>
        body { margin: 0; padding: 0; }
        a { text-decoration: none; }
    </style>
</head>
<body style="margin:0;padding:0;background:#f4f6f9;font-family:Arial,Helvetica,sans-serif;color:#14212e;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f4f6f9;padding:28px 12px;">
  <tr><td align="center">
    <table role="presentation" width="600" align="center" cellpadding="0" cellspacing="0" border="0" style="width:600px;max-width:600px;margin:0 auto;background:#ffffff;border-radius:16px;overflow:hidden;border:1px solid #e3e8ef;box-shadow:0 10px 32px rgba(12,74,151,0.22);-fs-box-shadow:0 10px 32px 0 rgba(12,74,151,0.22);">

      <!-- header: wordmark -->
      <tr><td style="background:#f4f6f9;border-bottom:1px solid #e3e8ef;padding:24px 32px;">
        <span style="color:#0c4a97;font-size:19px;font-weight:700;letter-spacing:.3px;">NX036</span>
        <span style="color:#5c6e7c;font-size:14px;font-weight:400;"> &#183; Dropshipping</span>
      </td></tr>

      <!-- body -->
      <tr><td style="padding:32px 32px 8px;">
        <h1 style="margin:0 0 12px;font-size:21px;font-weight:700;color:#14212e;">
          <img src="cid:circle-check" width="24" height="24" alt="" style="width:24px;height:24px;vertical-align:middle;margin-right:9px;" />
          <span>Order confirmed</span>
        </h1>
        <p style="margin:0 0 10px;font-size:14px;line-height:1.6;color:#5c6e7c;">Order <strong style="color:#14212e;" th:text="${orderNumber}">NX-...</strong> has been received.</p>
        <p style="margin:0 0 10px;font-size:14px;line-height:1.6;color:#5c6e7c;">Total: <strong style="color:#14212e;" th:text="${total}">$0.00</strong></p>
        <p style="margin:0;font-size:14px;line-height:1.6;color:#5c6e7c;">We will notify you when the shipment is on the way.</p>
      </td></tr>

      <!-- footer -->
      <tr><td style="padding:24px 32px;border-top:1px solid #e3e8ef;background:#f4f6f9;">
        <p style="margin:0;color:#5c6e7c;font-size:12px;line-height:1.6;">NX036 Dropshipping · &#169; 2026</p>
      </td></tr>

    </table>
  </td></tr>
</table>
</body>
</html>
