<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title th:text="${title}">NX036</title>
    <style>
        body { margin: 0; padding: 0; }
        a { text-decoration: none; }
    </style>
</head>
<body style="margin:0;padding:0;background:#F4F1FB;font-family:Arial,Helvetica,sans-serif;color:#1F1B2E;">
<!-- preheader oculto -->
<div style="display:none;max-height:0;overflow:hidden;opacity:0;mso-hide:all;" th:text="${preheader} ?: ''"></div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#F4F1FB;padding:28px 12px;">
  <tr><td align="center">
    <table role="presentation" width="600" align="center" cellpadding="0" cellspacing="0" border="0" style="width:600px;max-width:600px;margin:0 auto;background:#ffffff;border-radius:16px;overflow:hidden;border:1px solid #E7E3F3;box-shadow:0 10px 32px rgba(124,108,208,0.22);-fs-box-shadow:0 10px 32px 0 rgba(124,108,208,0.22);">

      <!-- header: wordmark (mismo estilo que el email de factura) -->
      <tr><td style="background:#F4F1FB;border-bottom:1px solid #E7E3F3;padding:24px 32px;">
        <span style="color:#7C6CD0;font-size:19px;font-weight:700;letter-spacing:.3px;">NX036</span>
        <span style="color:#6B6780;font-size:14px;font-weight:400;"> &#183; Dropshipping</span>
      </td></tr>

      <!-- body -->
      <tr><td style="padding:32px 32px 8px;">
        <h1 style="margin:0 0 12px;font-size:21px;font-weight:700;color:#1F1B2E;">
          <img th:if="${icon}" th:src="'cid:' + ${icon}" width="24" height="24" alt=""
               style="width:24px;height:24px;vertical-align:middle;margin-right:9px;" />
          <span th:text="${title}">Título</span>
        </h1>
        <div style="margin:0;font-size:14px;line-height:1.6;color:#6B6780;" th:utext="${bodyHtml} ?: ${body}">Cuerpo del mensaje.</div>
      </td></tr>

      <!-- CTA (bulletproof button) -->
      <tr th:if="${ctaUrl}"><td align="center" style="padding:24px 32px 8px;">
        <!--[if mso]>
        <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word" th:attr="href=${ctaUrl}" style="height:46px;v-text-anchor:middle;width:260px;" arcsize="22%" stroke="f" fillcolor="#7C6CD0">
          <w:anchorlock/>
          <center style="color:#ffffff;font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:bold;" th:text="${ctaLabel} ?: 'Ver'">Ver</center>
        </v:roundrect>
        <![endif]-->
        <!--[if !mso]><!-->
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 auto;">
          <tr><td align="center" style="border-radius:10px;background:#7C6CD0;">
            <a th:href="${ctaUrl}" th:text="${ctaLabel} ?: 'Ver'" style="display:inline-block;padding:13px 32px;color:#ffffff;font-size:14px;font-weight:700;text-decoration:none;border-radius:10px;font-family:Arial,Helvetica,sans-serif;">Ver</a>
          </td></tr>
        </table>
        <!--<![endif]-->
      </td></tr>

      <!-- footer -->
      <tr><td style="padding:24px 32px;border-top:1px solid #E7E3F3;background:#F4F1FB;">
        <p style="margin:0;color:#6B6780;font-size:12px;line-height:1.6;">
          <span th:text="${footer} ?: 'NX036 Dropshipping'">NX036 Dropshipping</span>
          <span th:if="${unsubscribeUrl}"> · <a th:href="${unsubscribeUrl}" style="color:#A99FE0;text-decoration:underline;">Darse de baja</a></span>
        </p>
        <p style="margin:8px 0 0;color:#A99FE0;font-size:11px;line-height:1.5;" th:text="${footerNote} ?: 'Este es un mensaje automático, no respondas a este correo.'">Mensaje automático.</p>
      </td></tr>

    </table>
  </td></tr>
</table>
</body>
</html>
