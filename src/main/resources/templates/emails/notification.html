<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">NX036</title>
</head>
<body style="margin:0;padding:0;background:#f1f5f9;font-family:'Segoe UI',Arial,Helvetica,sans-serif;color:#0f172a;">
<!-- preheader (hidden) -->
<div style="display:none;max-height:0;overflow:hidden;opacity:0;" th:text="${preheader} ?: ''"></div>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f1f5f9;padding:24px 12px;">
  <tr><td align="center">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 1px 3px rgba(15,23,42,.08);">

      <!-- header -->
      <tr><td style="background:#4f46e5;padding:22px 32px;">
        <span style="color:#ffffff;font-size:18px;font-weight:700;letter-spacing:.3px;">NX036</span>
        <span style="color:#c7d2fe;font-size:13px;margin-left:6px;">Dropshipping</span>
      </td></tr>

      <!-- body -->
      <tr><td style="padding:32px;">
        <h1 style="margin:0 0 12px;font-size:20px;font-weight:700;color:#0f172a;" th:text="${title}">Título</h1>
        <div style="margin:0 0 8px;font-size:15px;line-height:1.6;color:#334155;" th:utext="${bodyHtml} ?: ${body}">
          Cuerpo del mensaje.
        </div>

        <!-- optional CTA -->
        <table role="presentation" th:if="${ctaUrl}" cellpadding="0" cellspacing="0" style="margin:24px 0 8px;">
          <tr><td style="border-radius:10px;background:#4f46e5;">
            <a th:href="${ctaUrl}" th:text="${ctaLabel} ?: 'Ver'"
               style="display:inline-block;padding:12px 24px;color:#ffffff;font-size:14px;font-weight:600;text-decoration:none;border-radius:10px;">Ver</a>
          </td></tr>
        </table>
      </td></tr>

      <!-- footer -->
      <tr><td style="padding:20px 32px;border-top:1px solid #e2e8f0;">
        <p style="margin:0;color:#94a3b8;font-size:12px;line-height:1.5;">
          NX036 Dropshipping · © 2026<br>
          <a th:if="${unsubscribeUrl}" th:href="${unsubscribeUrl}" style="color:#94a3b8;text-decoration:underline;">Darse de baja</a>
          <span th:if="${unsubscribeUrl}"> · </span>
          <span th:text="${footerNote} ?: 'Este es un mensaje automático, no respondas a este correo.'">Mensaje automático.</span>
        </p>
      </td></tr>

    </table>
  </td></tr>
</table>
</body>
</html>
