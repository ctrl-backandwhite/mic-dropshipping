<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${subject}">Factura</title>
    <style>
        @page { size: A4; margin: 24px; }
        body { margin: 0; padding: 0; }
    </style>
</head>
<body style="margin:0;padding:0;background:#f1f5f9;font-family:'Segoe UI',Arial,Helvetica,sans-serif;color:#0f172a;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;" th:text="${preheader} ?: ''"></div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f1f5f9;padding:24px 12px;">
  <tr><td align="center">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;background:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 1px 3px rgba(15,23,42,.08);">

      <!-- header -->
      <tr><td style="background:#4f46e5;padding:22px 28px;">
        <span style="color:#ffffff;font-size:18px;font-weight:700;letter-spacing:.3px;">NX036</span>
        <span style="color:#c7d2fe;font-size:13px;margin-left:6px;">Dropshipping</span>
      </td></tr>

      <!-- intro -->
      <tr><td style="padding:28px 28px 8px;">
        <h1 style="margin:0 0 6px;font-size:20px;font-weight:700;" th:text="${title}">Pago confirmado</h1>
        <p style="margin:0;font-size:14px;line-height:1.6;color:#334155;" th:text="${intro}">Gracias por tu compra.</p>
      </td></tr>

      <!-- meta -->
      <tr><td style="padding:16px 28px 0;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="font-size:13px;color:#475569;">
          <tr>
            <td style="vertical-align:top;padding-bottom:10px;">
              <div style="font-weight:700;color:#0f172a;" th:text="${labelInvoice}">Factura</div>
              <div th:text="${orderNumber}">NX-000</div>
              <div th:text="${invoiceDate}">17/06/2026</div>
              <div th:if="${paymentMethod}"><span th:text="${labelMethod}">Método</span>: <span th:text="${paymentMethod}">CARD</span></div>
            </td>
            <td style="vertical-align:top;padding-bottom:10px;text-align:right;">
              <div style="font-weight:700;color:#0f172a;" th:text="${labelShipTo}">Enviar a</div>
              <div th:text="${shipName}">Nombre</div>
              <div th:text="${shipLine1}">Calle</div>
              <div th:text="${shipCityLine}">Ciudad</div>
              <div th:text="${shipCountry}">País</div>
            </td>
          </tr>
        </table>
      </td></tr>

      <!-- items -->
      <tr><td style="padding:16px 28px 0;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="font-size:13px;border-collapse:collapse;">
          <tr style="background:#f8fafc;">
            <th align="left"  style="padding:8px 10px;color:#64748b;font-weight:600;border-bottom:1px solid #e2e8f0;" th:text="${colItem}">Artículo</th>
            <th align="center" style="padding:8px 10px;color:#64748b;font-weight:600;border-bottom:1px solid #e2e8f0;" th:text="${colQty}">Cant.</th>
            <th align="right" style="padding:8px 10px;color:#64748b;font-weight:600;border-bottom:1px solid #e2e8f0;" th:text="${colPrice}">Precio</th>
            <th align="right" style="padding:8px 10px;color:#64748b;font-weight:600;border-bottom:1px solid #e2e8f0;" th:text="${colTotal}">Total</th>
          </tr>
          <tr th:each="it : ${items}">
            <td style="padding:10px;border-bottom:1px solid #f1f5f9;color:#0f172a;">
              <span th:text="${it.title}">Producto</span>
              <span th:if="${it.sku}" style="display:block;color:#94a3b8;font-size:11px;" th:text="${it.sku}">SKU</span>
            </td>
            <td align="center" style="padding:10px;border-bottom:1px solid #f1f5f9;" th:text="${it.qty}">1</td>
            <td align="right" style="padding:10px;border-bottom:1px solid #f1f5f9;" th:text="${it.unit}">$0.00</td>
            <td align="right" style="padding:10px;border-bottom:1px solid #f1f5f9;font-weight:600;" th:text="${it.lineTotal}">$0.00</td>
          </tr>
        </table>
      </td></tr>

      <!-- totals -->
      <tr><td style="padding:8px 28px 0;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="font-size:13px;">
          <tr><td align="right" style="padding:4px 10px;color:#64748b;" th:text="${labelSubtotal}">Subtotal</td><td align="right" width="110" style="padding:4px 10px;" th:text="${subtotal}">$0.00</td></tr>
          <tr><td align="right" style="padding:4px 10px;color:#64748b;" th:text="${labelShipping}">Envío</td><td align="right" style="padding:4px 10px;" th:text="${shipping}">$0.00</td></tr>
          <tr><td align="right" style="padding:4px 10px;color:#64748b;" th:text="${labelTax}">Impuestos</td><td align="right" style="padding:4px 10px;" th:text="${tax}">$0.00</td></tr>
          <tr><td align="right" style="padding:10px;font-weight:700;font-size:15px;border-top:1px solid #e2e8f0;" th:text="${labelTotal}">Total</td><td align="right" style="padding:10px;font-weight:700;font-size:15px;border-top:1px solid #e2e8f0;color:#4f46e5;" th:text="${total}">$0.00</td></tr>
        </table>
      </td></tr>

      <!-- CTA download (solo email) -->
      <tr th:if="${ctaUrl}"><td style="padding:8px 28px 24px;">
        <table role="presentation" cellpadding="0" cellspacing="0" style="margin:8px 0;">
          <tr><td style="border-radius:10px;background:#4f46e5;">
            <a th:href="${ctaUrl}" th:text="${ctaLabel}" style="display:inline-block;padding:12px 24px;color:#ffffff;font-size:14px;font-weight:600;text-decoration:none;border-radius:10px;">Descargar factura</a>
          </td></tr>
        </table>
      </td></tr>

      <!-- footer -->
      <tr><td style="padding:18px 28px;border-top:1px solid #e2e8f0;">
        <p style="margin:0;color:#94a3b8;font-size:12px;line-height:1.5;" th:text="${footer}">NX036 Dropshipping</p>
      </td></tr>

    </table>
  </td></tr>
</table>
</body>
</html>
