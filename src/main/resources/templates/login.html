<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>NX036 · Sign in</title>
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body { font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
               background: #f7f8fc; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background: #fff; border-radius: 18px; padding: 40px 36px; width: 380px; box-shadow: 0 30px 60px -25px rgba(15,23,42,.1); }
        h1 { margin: 0 0 8px; color: #0f172a; font-size: 22px; }
        p.sub { color: #64748b; margin: 0 0 28px; font-size: 14px; }
        label { display: block; font-size: 13px; color: #475569; margin: 14px 0 6px; }
        input { width: 100%; padding: 11px 13px; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 14px; outline: none; }
        input:focus { border-color: #6366f1; box-shadow: 0 0 0 4px rgba(99,102,241,.15); }
        button { width: 100%; padding: 12px; background: #4f46e5; color: #fff; border: 0; border-radius: 10px; font-weight: 600; margin-top: 22px; cursor: pointer; }
        button:hover { background: #4338ca; }
        .err { background: #fee2e2; color: #991b1b; padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; }
        .small { text-align: center; margin-top: 18px; font-size: 13px; color: #64748b; }
        .small a { color: #4f46e5; text-decoration: none; }
    </style>
</head>
<body>
<div class="card">
    <h1>NX036</h1>
    <p class="sub">Sign in to your dashboard</p>
    <div class="err" th:if="${param.error}">Invalid email or password.</div>
    <div class="err" th:if="${param.logout}" style="background:#dcfce7;color:#166534">You have been signed out.</div>
    <form th:action="@{/login}" method="post">
        <label for="username">Email</label>
        <input id="username" type="email" name="username" required autofocus>
        <label for="password">Password</label>
        <input id="password" type="password" name="password" required>
        <button type="submit">Sign in</button>
        <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    </form>
    <p class="small">Need an account? <a href="/register">Create one</a></p>
</div>
</body>
</html>
