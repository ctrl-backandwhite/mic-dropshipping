<!doctype html>
<!--
  La página a la que se llega desde el enlace de baja de un correo.

  Va con la MISMA marca y la MISMA paleta que los correos: se abre pulsando en uno de ellos, así que
  quien llega compara las dos pantallas sin querer. Traía un morado (#7C6CD0) que no existe en ninguna
  otra parte del producto y una caja con la letra «N» como logotipo, que tampoco.

  El icono va como SVG en línea, no por CID: esto es una página que sirve el backend, y ahí no hay
  adjuntos que referenciar. En línea, además, no depende de ninguna petición extra ni de que un
  bloqueador la deje pasar.
-->
<html th:lang="${lang}" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="robots" content="noindex,nofollow"/>
  <title th:text="${title}">NX036</title>
</head>
<body style="margin:0;background:#f4f6f9;font-family:Arial,Helvetica,sans-serif;color:#14212e;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="min-height:100vh;">
    <tr><td align="center" valign="middle" style="padding:40px 16px;">
      <table role="presentation" width="440" cellpadding="0" cellspacing="0" border="0"
             style="width:440px;max-width:440px;background:#ffffff;border-radius:16px;border:1px solid #e3e8ef;box-shadow:0 10px 32px rgba(12,74,151,0.22);">
        <tr><td style="padding:34px 34px 8px;text-align:center;">
          <span style="color:#14212e;font-size:19px;font-weight:700;letter-spacing:.3px;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="20" height="20" fill="#0c4a97" role="img" aria-hidden="true" style="vertical-align:-3px;margin-right:8px;"><path d="M418.4 157.9c35.3-8.3 61.6-40 61.6-77.9 0-44.2-35.8-80-80-80-43.4 0-78.7 34.5-80 77.5L136.2 151.1C121.7 136.8 101.9 128 80 128 35.8 128 0 163.8 0 208s35.8 80 80 80c12.2 0 23.8-2.7 34.1-7.6L259.7 407.8c-2.4 7.6-3.7 15.8-3.7 24.2 0 44.2 35.8 80 80 80s80-35.8 80-80c0-27.7-14-52.1-35.4-66.4l37.8-207.7zM156.3 232.2c2.2-6.9 3.5-14.2 3.7-21.7l183.8-73.5c3.6 3.5 7.4 6.7 11.6 9.5L317.6 354.1c-5.5 1.3-10.8 3.1-15.8 5.5L156.3 232.2z"/></svg>NX036</span>
        </td></tr>
        <tr><td style="padding:8px 34px 0;text-align:center;">
          <h1 style="margin:0 0 10px;font-size:20px;font-weight:700;color:#14212e;" th:text="${title}">NX036</h1>
          <p style="margin:0;font-size:14px;line-height:1.6;color:#5c6e7c;" th:text="${message}"></p>
        </td></tr>
        <tr><td style="padding:24px 34px 34px;text-align:center;">
          <a th:href="${actionUrl}" th:text="${actionLabel}"
             style="display:inline-block;padding:12px 30px;background:#0c4a97;color:#ffffff;font-size:14px;font-weight:700;text-decoration:none;border-radius:10px;">Continuar</a>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
