# =====================================================================================
# Perfil DEV (despliegue remoto Railway, entorno de desarrollo)
#   Frontend: https://front-dropshipping-des.up.railway.app
#   Backend : https://back-dropshipping-des.up.railway.app  (servidor de autorización)
#
# Local sigue usando application-local.yml (localhost). Aquí solo se sobrescriben las URLs
# públicas: issuer del authorization server (backend) y los dominios de confianza (frontend)
# para redirects OAuth, callback de Google, CORS y enlaces de email.
#
# Los SECRETOS (Google client id/secret, BD, KEKs, etc.) NUNCA van aquí: se inyectan por
# variables de entorno en Railway (ya soportadas en application.yml).
# =====================================================================================
spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  liquibase:
    # Datos reales: NO ejecutar los seeds demo (context:demo), que asumen usuarios/catálogo previos.
    contexts: "!demo"
  kafka:
    # Kafka KRaft seguro (SASL/SCRAM) en Railway. El JAAS (usuario+password) llega por env.
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:SASL_PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:SCRAM-SHA-256}
      sasl.jaas.config: ${KAFKA_SASL_JAAS:}
  security:
    oauth2:
      client:
        registration:
          google:
            # Auth por token (sin proxy nginx): Google redirige al BACKEND; su success handler
            # emite el token y redirige al front (<front>/auth/callback#token=…).
            redirect-uri: "https://back-dropshipping-des.up.railway.app/login/oauth2/code/google"
          github:
            redirect-uri: "https://back-dropshipping-des.up.railway.app/login/oauth2/code/github"

server:
  servlet:
    session:
      cookie:
        secure: true        # HTTPS en Railway
        same-site: lax       # el SPA usa el dominio del frontend (mismo origen vía proxy) → lax es correcto

nexadrop:
  storefront:
    base-url: https://front-dropshipping-des.up.railway.app   # CTA / unsubscribe de los emails
  oauth:
    # Identidad del authorization server y emisor de los JWT de usuario (este backend).
    issuer: https://back-dropshipping-des.up.railway.app
  cors:
    # Dominios de confianza desde los que se accede a la API (frontend + el propio backend).
    allowed-origins: https://front-dropshipping-des.up.railway.app,https://back-dropshipping-des.up.railway.app
  cainiao:
    # En DESARROLLO la integración REAL está activa por defecto (sandbox de Cainiao Link).
    # Freno temporal: mientras la app NO esté aprobada por Cainiao y los campos sin mapear, dejar la
    # env var CAINIAO_ENABLED=false en Railway (override). Al quitarla, este default (true) activa el real.
    enabled: ${CAINIAO_ENABLED:true}
    base-url: ${CAINIAO_BASE_URL:https://linkdaily.tbsandbox.com/gateway/link.do}
