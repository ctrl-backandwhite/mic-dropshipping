spring:
  application:
    name: nexadrop-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  threads:
    virtual:
      enabled: true
  mvc:
    async:
      # No timeout for async/streaming responses (StreamingResponseBody). The NDJSON export streams the
      # whole catalogue in batches and can take much longer than the default 30s; without this the async
      # request is aborted mid-stream and the download is truncated.
      request-timeout: -1

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5532}/${DB_NAME:nexadrop}
    username: ${DB_USER:nexadrop}
    password: ${DB_PASSWORD:nexadrop}
    hikari:
      # Plan 300k req/min: con virtual threads y 4 instancias necesitamos pool
      # generoso. PgBouncer en transaction mode delante absorberá los picos.
      maximum-pool-size: ${DB_POOL_MAX:50}
      minimum-idle: ${DB_POOL_MIN:10}
      connection-timeout: 5000
      idle-timeout: 60000
      max-lifetime: 1800000
      leak-detection-threshold: 30000
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 500
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
        reWriteBatchedInserts: true

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
          time_zone: UTC
        order_inserts: true
        order_updates: true
        # L2 cache via JCache (Caffeine provider) — habilitable por env.
        cache:
          use_second_level_cache: ${HIBERNATE_L2:false}
          use_query_cache: false
    open-in-view: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6479}
      # Railway/managed Redis exige auth. Vacío en local (sin password). SSL solo si el proveedor lo pide.
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:19192}
    consumer:
      group-id: nexadrop-backend
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: java.util.HashMap
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        spring.json.add.type.headers: true

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1125}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_TLS:false}

  jackson:
    deserialization:
      # Spring Boot 4 trae este flag ACTIVADO: un campo primitivo que no venga en el JSON llega como null
      # al constructor (Lombok @AllArgsConstructor + parameter-names) y la petición entera se rechaza con
      # "JSON inválido". Rompía el login si el cliente omitía `linkSocial`, y afectaba igual al checkout y
      # a otros DTOs con primitivos. Un campo opcional ausente debe valer su default, no tumbar la llamada.
      fail-on-null-for-primitives: false

  messages:
    basename: i18n/messages
    encoding: UTF-8

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false

  # Plan 300k: graceful shutdown — el LB necesita 30s para drenar in-flight.
  lifecycle:
    timeout-per-shutdown-phase: 30s

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:changeme-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:changeme-google-client-secret}
            scope: openid,email,profile
            redirect-uri: "${GOOGLE_REDIRECT_URI:http://localhost:3003/login/oauth2/code/google}"
          github:
            # GitHub es un proveedor común de Spring (no requiere bloque provider). Pedimos
            # user:email porque el correo puede ser privado: el primario verificado se resuelve
            # vía /user/emails en GithubOAuth2UserService.
            client-id: ${GITHUB_CLIENT_ID:changeme-github-client-id}
            client-secret: ${GITHUB_CLIENT_SECRET:changeme-github-client-secret}
            scope: read:user,user:email
            redirect-uri: "${GITHUB_REDIRECT_URI:http://localhost:3003/login/oauth2/code/github}"

server:
  # Railway/Heroku inyectan PORT en runtime; si no, usamos SERVER_PORT y por último 18082 (local).
  port: ${PORT:${SERVER_PORT:18082}}
  forward-headers-strategy: framework
  max-http-request-header-size: 16KB
  # Plan 300k: graceful shutdown para que el LB drene tráfico antes del kill.
  shutdown: graceful
  tomcat:
    # Con virtual threads habilitados, el thread pool clásico es menos crítico
    # pero seguimos subiendo el techo para los IO blocking calls que aún quedan.
    threads:
      max: ${TOMCAT_THREADS_MAX:800}
      min-spare: ${TOMCAT_THREADS_MIN:50}
    accept-count: 200
    max-connections: 16384
    connection-timeout: 5s
    keep-alive-timeout: 30s
    max-keep-alive-requests: 200
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/css,text/plain
    min-response-size: 1024
  http2:
    enabled: true
  error:
    # No filtrar mensajes internos ni errores de binding al cliente por el error controller por defecto
    # (fuera del DispatcherServlet). El GlobalExceptionHandler ya devuelve mensajes controlados (IS001).
    include-message: never
    include-binding-errors: never
  servlet:
    session:
      cookie:
        http-only: true
        secure: false  # set true behind HTTPS
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      # Plan 300k: separar readiness (BD/Redis/Kafka) de liveness (proceso vivo)
      # para que el LB pueda drenar tráfico sin matar la JVM.
      probes:
        enabled: true
      # `validate-group-membership: false` permite que los contributors opcionales
      # (opensearch, redis) se omitan en dev cuando el servicio no está corriendo.
      validate-group-membership: false
      group:
        readiness:
          include: db,redis,opensearch
        liveness:
          include: livenessState

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# ============ NexaDrop-specific config ============
nexadrop:
  search:
    # Reindexar el catálogo al arrancar SI el índice acaba de crearse (versión de esquema nueva). Sin esto
    # la búsqueda quedaría degradada al fallback SQL hasta que alguien pulsara "Sincronizar" en el admin.
    auto-reindex: ${SEARCH_AUTO_REINDEX:true}
  # Plan 300k: toggles para activar/desactivar lo nuevo en cada entorno.
  cache:
    distributed: ${CACHE_DISTRIBUTED:false}     # Redis CacheManager en prod
  db:
    replica-enabled: ${DB_REPLICA_ENABLED:false} # routing primary/replica
  ratelimit:
    redis-enabled: ${RATELIMIT_REDIS_ENABLED:false} # Bucket4j sobre Redis
  outbox:
    poll-ms: ${OUTBOX_POLL_MS:500}              # dispatcher polling interval
  storefront:
    base-url: ${STOREFRONT_BASE_URL:http://localhost:3003}  # for email CTA / unsubscribe links
  mobile:
    # Enlace profundo con el que la app recupera el control tras el login social. Es un esquema propio
    # porque el sistema operativo solo sabe devolver el foco a la aplicación por él. Debe coincidir con
    # el `scheme` de app.config.ts en el repositorio de la app.
    oauth-callback-url: ${MOBILE_OAUTH_CALLBACK_URL:nx036://auth/callback}
  trend:
    # Puntuación de «Tendencia ahora», recalculada desde las ventas REALES de la tienda. Antes no la
    # escribía nadie —solo el sembrador de demo, apagado— y 5.220 de 5.524 productos estaban a cero: la
    # sección mostraba siempre los mismos 81, los únicos con dato.
    recompute-enabled: ${TREND_RECOMPUTE_ENABLED:true}
    recompute-cron: ${TREND_RECOMPUTE_CRON:0 20 3 * * *}
    # El índice guarda su propia copia de la puntuación y desempata con ella: sin reindexar,
    # base e índice divergen desde la primera pasada.
    reindex-after-recompute: ${TREND_REINDEX_AFTER:true}
  legal:
    # Versión vigente de los términos y la política de privacidad, en formato fecha. Se guarda junto a la
    # aceptación de cada usuario para poder acreditar QUÉ texto aceptó, no solo que aceptó algo.
    # Al publicar una redacción nueva hay que subir este valor Y el LEGAL_UPDATED del escaparate a la vez:
    # si se separan, unos usuarios quedan registrados contra una versión que nunca vieron.
    version: ${LEGAL_VERSION:2026-08-15}
    # Al desplegar una versión nueva se avisa por correo a TODAS las cuentas activas (no es publicidad: es
    # un cambio en las condiciones, así que alcanza también a quien rechazó las campañas). Se envía UNA vez
    # por versión — lo garantiza la tabla legal_version_notice, no esta bandera.
    notify-on-change: ${LEGAL_NOTIFY_ON_CHANGE:true}
  captcha:
    # CAPTCHA proof-of-work (ALTCHA) en formularios públicos: registro, contacto, reset y newsletter.
    enabled: ${CAPTCHA_ENABLED:true}
    # Clave HMAC que firma los retos. En PROD fíjala por entorno (si se deja vacía se genera una
    # aleatoria por arranque: vale para local/PRE de un solo nodo, pero un reinicio invalida retos en vuelo).
    hmac-key: ${CAPTCHA_HMAC_KEY:}
    max-number: ${CAPTCHA_MAX_NUMBER:100000}   # coste del proof-of-work (a mayor, más caro para el bot)
    expiry-seconds: ${CAPTCHA_EXPIRY_SECONDS:300}
  invoice:
    # Datos fiscales del EMISOR para que la factura sea un documento legal. Rellénalos por
    # entorno (Railway). Si legal-name queda vacío, el bloque del emisor NO se pinta.
    issuer:
      # Titular: NX036 LLC, sociedad de Wyoming (EE. UU.) de un solo miembro. Los mismos datos que
      # figuran en el aviso legal y en los términos — «NX036» es el nombre comercial; quien contrata y
      # responde es la sociedad. Si cambian, se tocan AQUÍ y en legalPages.ts, y nada más.
      #
      # Estaban vacíos, y con legal-name vacío la plantilla NO pinta el bloque del emisor: se emitían
      # facturas sin identificar a quien las emite, que es el requisito más básico del reglamento de
      # facturación (RD 1619/2012, art. 6).
      #
      # ⚠ tax-id lleva un marcador. Una factura sin NIF del emisor no es válida.
      legal-name: ${INVOICE_ISSUER_LEGAL_NAME:NX036 LLC}
      tax-id: ${INVOICE_ISSUER_TAX_ID:PENDIENTE-EIN}
      address: ${INVOICE_ISSUER_ADDRESS:30 N Gould St, Ste R}
      city-line: ${INVOICE_ISSUER_CITY_LINE:Sheridan, WY 82801}
      country: ${INVOICE_ISSUER_COUNTRY:Estados Unidos}
      email: ${INVOICE_ISSUER_EMAIL:support@nx036.com}
      registry: ${INVOICE_ISSUER_REGISTRY:}         # Vacío hasta tener el número de registro de Wyoming
    legal-note: ${INVOICE_LEGAL_NOTE:}              # Nota legal al pie (opcional)
  email:
    from: ${EMAIL_FROM:noreply@nexadrop.local}          # Remitente por defecto (transaccional/auth): no-reply@
    from-name: ${EMAIL_FROM_NAME:NX036}
    from-billing: ${EMAIL_FROM_BILLING:${EMAIL_FROM:noreply@nexadrop.local}}  # Facturas/recibos: billing@
    from-support: ${EMAIL_FROM_SUPPORT:${EMAIL_FROM:noreply@nexadrop.local}}  # Acuse de contacto: support@
    unsubscribe-secret: ${EMAIL_UNSUBSCRIBE_SECRET:dev-unsubscribe-secret-change-me}  # firma HMAC del enlace de baja (sin login)
  oauth:
    # Identidad del authorization server y emisor de los JWT de usuario (login por token).
    issuer: ${OAUTH_ISSUER:http://localhost:18082}
    partner-api:
      default-secret: ${PARTNER_DEFAULT_SECRET:dev-partner-secret-change-me}

  # Seguridad: nº de proxies de confianza por delante (para resolver la IP real en el rate limit).
  security:
    trusted-proxy-count: ${TRUSTED_PROXY_COUNT:1}

  # AES-256-GCM key encryption for at-rest secrets (shop access tokens, webhook secrets).
  # Comma-separated list of Base64-encoded 32-byte keys. First entry is the active KEK.
  # Older entries still decrypt previously-encrypted records, enabling rotation.
  # Generate with: openssl rand -base64 32
  # If empty in dev, an ephemeral key is generated at startup (NOT for production).
  crypto:
    token-keks: ${NX_TOKEN_KEKS:}

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3003}

  opensearch:
    uris: ${OPENSEARCH_URIS:http://localhost:9400}
    # Auth básica del plugin de seguridad (vacío en local sin auth; en remoto seguro = admin + clave).
    username: ${OPENSEARCH_USERNAME:}
    password: ${OPENSEARCH_PASSWORD:}
    # TLS relajado SOLO para el cert autofirmado del OpenSearch interno (red privada). Estricto por defecto.
    tls-insecure: ${OPENSEARCH_TLS_INSECURE:false}
    # Nombre LÓGICO. El índice real lleva la versión del esquema (products-v2): el mapping de un índice no
    # se puede cambiar en caliente, así que cambiar analizadores = índice nuevo. Ver ProductIndexSchema.
    products-index: products
    categories-index: categories
    suppliers-index: suppliers
    orders-index: orders
    wallets-index: wallets
    affiliates-index: affiliates
    operator-actions-index: operator-actions

  crawler:
    base-url: ${CRAWLER_URL:http://localhost:8001}
    timeout-seconds: 60

  translation:
    enabled: ${TRANSLATION_ENABLED:false}
    project-id: ${GOOGLE_PROJECT_ID:}
    default-source: zh
    target-languages: es,en,pt

  stripe:
    enabled: ${STRIPE_ENABLED:false}
    secret-key: ${STRIPE_SECRET_KEY:}
    # Clave PÚBLICA (pk_test/pk_live): se expone al frontend para Stripe Elements (guardar tarjeta).
    # Acepta STRIPE_PUBLISHABLE_KEY o, por compatibilidad con el .env actual, STRIPE_PUBLIC_KEY.
    publishable-key: ${STRIPE_PUBLISHABLE_KEY:${STRIPE_PUBLIC_KEY:}}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    # Identificadores que se inyectan como metadata en cada PaymentIntent.
    # Útil cuando varias plataformas comparten la misma cuenta Stripe — filtras en el dashboard
    # por metadata['platform'] = "nexadrop-dropshipping" para aislar lo de esta plataforma.
    platform-id: ${STRIPE_PLATFORM_ID:nexadrop-dropshipping}
    platform-env: ${STRIPE_PLATFORM_ENV:dev}


  currency:
    access-key: ${NEXADROP_CURRENCY_ACCESS_KEY:}
    api-url: ${NEXADROP_CURRENCY_API_URL:https://api.currencylayer.com/live}
    # Una vez al día (04:30). Una sola llamada trae TODAS las divisas, así que son ~31 requests al mes:
    # cabe de sobra en el plan gratuito. La cadencia se cambia por entorno, sin tocar código ni
    # recompilar, cuando el plan lo permita:
    #
    #   0 */5 * * * *   cada 5 min → 288/día · 8.928/mes  (necesita plan de 10.000; ~11% de margen)
    #   0 0 * * * *     cada hora  →  24/día ·   744/mes  (opción intermedia, muy holgada)
    #   0 30 4 * * *    diaria     →   1/día ·    31/mes  (actual)
    #
    # Ojo al elegir: los reintentos tras un fallo, los reinicios y las sincronizaciones manuales del
    # admin también consumen cuota, así que conviene no apurar el límite del plan.
    sync-cron: ${NEXADROP_CURRENCY_SYNC_CRON:0 30 4 * * *}

  paypal:
    enabled: ${PAYPAL_ENABLED:false}
    client-id: ${PAYPAL_CLIENT_ID:}
    client-secret: ${PAYPAL_CLIENT_SECRET:}
    webhook-secret: ${PAYPAL_WEBHOOK_SECRET:}
    base-url: ${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
    return-url: ${PAYPAL_RETURN_URL:http://localhost:3003/wallet/paypal-return}
    cancel-url: ${PAYPAL_CANCEL_URL:http://localhost:3003/wallet/recharge?cancelled=1}

  coinbase:
    api-key: ${COINBASE_API_KEY:}
    webhook-secret: ${COINBASE_WEBHOOK_SECRET:}

  # Sondeo del seguimiento del envío con el transportista activo (YunExpress). La integración con Cainiao
  # se retiró —su aprobación quedó bloqueada— y su código se eliminó; solo sobrevive la tabla de zonas
  # `cainiao_shipping_zone`, que YunExpress reutiliza como cobertura de países (base, por-kg y plazo).
  fulfillment:
    sync-enabled: ${FULFILLMENT_SYNC_ENABLED:true}
    sync-interval-ms: ${FULFILLMENT_SYNC_INTERVAL_MS:60000}
    # Almacén chino de Yunfulfillment donde el proveedor de 1688 entrega la mercancía.
    #
    # CNCHASHAN (Dongguan, Guangdong) es el almacén DEFINITIVO del negocio, decidido el 8-ago-2026.
    # La alternativa era CNJIASHAN (Jiashan, Zhejiang). No es un valor por defecto provisional: cambiarlo
    # parte el catálogo en dos, porque no se pueden consolidar en un mismo envío bultos que están en
    # almacenes distintos, y todo pedido multiproveedor dejaría de poder agruparse bajo un único YT.
    #
    # TESTSTORE aparece en los desplegables pero NO admite importación (ver PackWarehouse).
    warehouse-code: ${FULFILLMENT_WAREHOUSE_CODE:CNCHASHAN}
    # Código de cliente en Yunfulfillment. Va en el destinatario Y pegado al final de la dirección:
    # sin él el almacén recibe un bulto que no sabe de quién es («地址选择错误，仓库无法查询操作»).
    customer-code: ${FULFILLMENT_CUSTOMER_CODE:CNHC459832}
  yunexpress:
    enabled: ${YUNEXPRESS_ENABLED:false}
    # 应用ID / 应用秘钥(AK) de 开发配置 → 沙盒应用, y sourcekey de 用户中心 → 用户信息.
    app-id: ${YUNEXPRESS_APP_ID:}
    app-secret: ${YUNEXPRESS_APP_SECRET:}
    source-key: ${YUNEXPRESS_SOURCE_KEY:}
    # Sandbox por defecto. Para producción basta cambiar esta URL a https://openapi.yunexpress.cn
    # y poner las credenciales de la aplicación formal: el contrato de la API es idéntico.
    base-url: ${YUNEXPRESS_BASE_URL:https://openapi-sbx.yunexpress.cn}
    # Clave de cifrado del webhook (开发配置 → 事件管理 → 加密策略). Vacía = el webhook rechaza todo.
    encrypt-key: ${YUNEXPRESS_ENCRYPT_KEY:}
    # Canal fijo (product_code de /v1/basic-data/products/getlist). Vacío = el más barato que cotice.
    product-code: ${YUNEXPRESS_PRODUCT_CODE:}
    # Grupo al que se restringe la simulación de tarifa (DH快递, EM经济, MA挂号, SP专线...). Vacío = todos.
    product-group-code: ${YUNEXPRESS_PRODUCT_GROUP:}
    # Canales que el CONTRATO permite usar, separados por comas. El transportista cotiza más líneas de las
    # que se pueden usar y cada una admite una mercancía distinta: FZZXR es la de ropa (solo textil en
    # bolsa) y THPHR la económica de carga general. Ofrecer una que no acepta lo que va dentro es cobrar un
    # envío que el almacén no puede despachar. Vacío = sin filtro: lo necesita el sandbox, cuyo canal BPA no
    # existe en producción. En PRE/PRO: YUNEXPRESS_ALLOWED_PRODUCT_CODES=FZZXR,THPHR
    allowed-product-codes: ${YUNEXPRESS_ALLOWED_PRODUCT_CODES:}
    # Formato de etiqueta pedido al crear el envío: PDF, ZPL o PNG.
    label-type: ${YUNEXPRESS_LABEL_TYPE:PDF}
    # Suscribir cada guía al push de trazabilidad al crearla (requiere el webhook registrado en 事件管理).
    tracking-subscription-enabled: ${YUNEXPRESS_TRACK_SUBSCRIBE:true}
    # A = trazabilidad completa, F = solo tramo de origen, L = solo reparto final, N = oculta.
    tracking-subscribe-type: ${YUNEXPRESS_TRACK_SUBSCRIBE_TYPE:A}
    # Espera máxima de la simulación de tarifa. Corto a propósito: está en el camino del checkout y hay
    # fallback inmediato por la tabla de zonas, así que no se hace esperar al cliente.
    quote-timeout-seconds: ${YUNEXPRESS_QUOTE_TIMEOUT:5}
    # Límites del canal contratado para repartir el pedido en bultos. 0 = no se reparte (todo en uno).
    # El reparto es SOLO por límites físicos: el umbral fiscal se evalúa sobre el pedido completo.
    # OJO: el PESO máximo ya no sale de aquí salvo como último recurso. Lo fija la tabla
    # `carrier_channel_limit` por (canal, país) —la línea de ropa admite 30 kg a España y 15 kg a
    # Dinamarca—, y este escalar solo se usa cuando el canal no está sembrado, que hoy es el caso del
    # canal BPA del sandbox. Se mantiene por eso: sin él, el entorno de pruebas dejaría de partir.
    max-parcel-weight-grams: ${YUNEXPRESS_MAX_PARCEL_WEIGHT_GRAMS:0}
    max-parcel-value-cents: ${YUNEXPRESS_MAX_PARCEL_VALUE_CENTS:0}
    max-parcel-units: ${YUNEXPRESS_MAX_PARCEL_UNITS:0}
    # Modo de despacho fiscal por defecto del canal: DDP (impuestos incluidos, los paga el comercio) o
    # DDU (los paga el destinatario). Se puede sobreescribir por país en yunexpress_channel (futuro).
    default-tax-mode: ${YUNEXPRESS_TAX_MODE:DDP}
    # Número IOSS del comercio para despacho de IVA en la UE (pedidos <=150 EUR). Vacío = sin IOSS.
    # Se deja vacío A PROPÓSITO: no tenemos IOSS propio, el IVA lo liquida YunExpress con el suyo.
    ioss-number: ${YUNEXPRESS_IOSS:}
    # Servicio adicional con el que se le pide a YunExpress que prepague el IVA con SU IOSS: V1 = 云途预缴.
    # La tienda vende DDP —cobra el impuesto en el checkout— y esa promesa solo se cumple si el envío lleva
    # este extra; sin él el paquete se despacha como si nadie hubiera pagado y se lo reclaman al cliente.
    # VACIARLO lo desactiva: si la cuenta del transportista no tuviera el servicio de alta, mandarlo hace
    # fallar la creación del envío, y eso debe poder apagarse sin desplegar.
    prepaid-vat-service-code: ${YUNEXPRESS_PREPAID_VAT_CODE:V1}
    # Peso VOLUMÉTRICO: el transportista factura el mayor entre peso real y L×W×H(cm)/divisor, y solo
    # aplica el volumétrico a partir de cierto volumen (los bultos pequeños en bolsa van por peso real).
    # El DIVISOR tampoco sale ya de aquí salvo como último recurso: está en `carrier_channel_limit` por
    # canal, porque no todas las líneas lo aplican —la de ropa factura el peso real en todos los países—
    # y las que lo aplican no dividen por lo mismo (la de carga general, entre 8000).
    volumetric-divisor: ${YUNEXPRESS_VOLUMETRIC_DIVISOR:6000}
    volumetric-min-cm3: ${YUNEXPRESS_VOLUMETRIC_MIN_CM3:6000}

  # ── CJ Dropshipping: el SEGUNDO transportista ────────────────────────────────────────────────────
  # Convive con YunExpress, no lo sustituye. Cuál de los dos puede llevar un pedido depende de la
  # mercancía: la línea FZZXR de YunExpress solo admite textil, así que un pedido que no sea ropa —o que
  # mezcle ropa con otra cosa— se ofrece por CJ.
  cj:
    enabled: ${CJ_ENABLED:false}
    base-url: ${CJ_BASE_URL:https://developers.cjdropshipping.com}
    # Formato CJ<numeroDeUsuario>@api@<clave>. NUNCA se escribe en el registro ni en un error.
    api-key: ${CJ_API_KEY:}
    # Cada cuántos días se renueva el token. La documentación de CJ dice que dura 15 días; la respuesta
    # real medida el 18-ago-2026 daba 180, para el token y para el refresco. A los 10 hay margen con
    # cualquiera de las dos, y un token revocado se descubre renovando y no en mitad de un checkout.
    token-refresh-days: ${CJ_TOKEN_REFRESH_DAYS:10}
    auth-timeout-seconds: ${CJ_AUTH_TIMEOUT:20}
    # El sandbox de CJ NO es otro servidor: es el mismo, con isSandbox=1 al crear el pedido. Por eso
    # esta bandera solo puede estar activa fuera de pre y producción, igual que el modo simulado.
    sandbox: ${CJ_SANDBOX:false}
    # País desde el que sale la mercancía almacenada en CJ.
    from-country: ${CJ_FROM_COUNTRY:CN}

  # Almacenamiento de objetos (MinIO/S3) para el mirror de imágenes de producto. El backend descarga
  # la imagen de origen (1688/alicdn, sin Referer) y la sube al bucket; el `public-url` es la base con
  # la que se sirve al navegador. Así dejamos de depender del hotlink de alicdn.
  storage:
    enabled: ${STORAGE_ENABLED:true}
    endpoint: ${STORAGE_ENDPOINT:http://minio:9000}              # interno backend → MinIO/S3
    public-url: ${STORAGE_PUBLIC_URL:http://localhost:9100/product-images}  # base navegable (browser)
    bucket: ${STORAGE_BUCKET:product-images}
    access-key: ${STORAGE_ACCESS_KEY:nexadrop}
    secret-key: ${STORAGE_SECRET_KEY:}
    region: ${STORAGE_REGION:us-east-1}
    # Cadencia/tamaño del job que espeja imágenes PENDING (importación + backfill).
    mirror-enabled: ${STORAGE_MIRROR_ENABLED:true}
    mirror-batch: ${STORAGE_MIRROR_BATCH:25}

  usdt:
    enabled: ${USDT_ENABLED:true}
    manual-address: ${USDT_MANUAL_ADDRESS:}  # sin default: si no se define, el pago USDT manual no opera
    chain: ${USDT_DEFAULT_CHAIN:TRC20}
    expiry-minutes: 30

logging:
  level:
    root: INFO
    com.nexaplatform.dropshipping: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN

  # Avisos al responsable cuando un servicio del que depende el negocio deja de funcionar (transportista
  # que no acepta envíos, pasarela que no cobra). Se agrupan por causa y se silencian durante el cooldown
  # para que una caída no llene el buzón justo cuando hay que leerlo.
  alerts:
    enabled: ${ALERTS_ENABLED:true}
    email: ${ALERTS_EMAIL:support@nx036.com}   # Buzón de la empresa, NUNCA un correo personal
    cooldown-minutes: ${ALERTS_COOLDOWN_MINUTES:30}
