name: Imagen

# Solo desde features: cada empujón aquí es una entrega a preproducción. Producción
# no se toca desde el CI, se promociona por pull request.
on:
  push:
    branches: [features]
  workflow_dispatch:

concurrency:
  # Si llegan dos empujones seguidos, el primero se cancela: publicar una imagen
  # vieja encima de una nueva deja preproducción con lo que no toca.
  group: imagen-backend
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Preparar JDK 21
        uses: actions/setup-java@v5
        with:
          # 21 aunque las imágenes usen JRE 25: el pom compila con release 21.
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Pruebas
        # La puerta: si algo está en rojo, no se publica imagen. Los tests de
        # integración van aparte porque necesitan Docker y tardan mucho más.
        run: mvn -B -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Entrar en el registro
        uses: docker/login-action@v3
        with:
          registry: registry.nx036.com
          username: ${{ secrets.HARBOR_USUARIO }}
          password: ${{ secrets.HARBOR_SECRETO }}

      - uses: docker/setup-buildx-action@v3

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # El tag es el SHA y nunca "latest". Es lo que hace que revertir sea
          # cambiar una línea, y que se sepa siempre qué código hay corriendo.
          tags: registry.nx036.com/nexadrop/backend:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Apuntar la entrega en el repositorio de despliegue
        env:
          LLAVE: ${{ secrets.DESPLIEGUE_SSH }}
        run: |
          mkdir -p ~/.ssh && echo "$LLAVE" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git clone git@github.com:ctrl-backandwhite/nexadrop-deploy.git /tmp/despliegue
          cd /tmp/despliegue
          # Se edita SOLO el overlay de preproducción. El de producción lo cambia
          # una persona por pull request, que es donde está la revisión.
          python3 - <<'PY'
          import re, os
          p = 'overlays/pre/kustomization.yaml'
          s = open(p).read()
          sha = os.environ['GITHUB_SHA']
          s = re.sub(r'(name: registry\.nx036\.com/nexadrop/backend\n    newTag: )\S+',
                     r'\g<1>sha-' + sha, s)
          open(p, 'w').write(s)
          PY
          git config user.name "entrega automática"
          git config user.email "ci@nx036.com"
          git commit -am "entrega(pre): backend sha-${GITHUB_SHA}" || exit 0
          git push
