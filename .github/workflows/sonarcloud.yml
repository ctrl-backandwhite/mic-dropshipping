name: SonarQube
on:
  push:
    branches:
      - main
      - develop
      - features
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "zulu" # Alternative distribution options are available.
      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Build
        run: mvn -B verify
      # Se analiza con el ESCÁNER DE MAVEN, no con la acción de GitHub.
      #
      # La acción corre el analizador dentro de su propio contenedor, y ese contenedor lleva Java 17;
      # SonarCloud dejó de admitirlo («Java 17 is not supported. Please upgrade to Java 21 or newer»),
      # así que fallaba en cada push con independencia del código. El `setup-java` de arriba no lo
      # arreglaba: no llega dentro del contenedor de la acción.
      #
      # Por Maven corre sobre el Java 21 del runner, que es el que ya se prepara para compilar, y
      # además es lo que la propia documentación de SonarSource indica para proyectos Maven.
      #
      # Sin parámetros `-D`: el `pom.xml` ya declara organización, clave de proyecto, URL, exclusiones
      # de cobertura y reglas ignoradas, y el escáner de Maven descubre solo fuentes, pruebas, clases
      # compiladas y el informe de JaCoCo. Repetirlos aquí era tener la misma decisión en dos sitios.
      - name: Analyze with SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # Coordenadas COMPLETAS, no el prefijo `sonar:sonar`: ese prefijo se resuelve por el grupo de
        # plugins `org.sonarsource.scanner.maven`, que Maven no busca por defecto —solo mira
        # `org.apache.maven.plugins` y `org.codehaus.mojo` más los declarados en el proyecto—, y sin él
        # responde «No plugin found for prefix 'sonar'».
        #
        # Sin fijar versión a propósito: así el escáner acompaña a los requisitos de SonarCloud —que es
        # lo que acaba de romperse al dejar de admitir Java 17— en vez de quedarse anclado a uno que
        # dentro de un año vuelva a quedar fuera.
        run: mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
